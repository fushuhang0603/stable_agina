server:
  port: 9003
  servlet:
    context-path: /stableanginaapi
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: stable-angina
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    table: flyway_schema_history
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: sk-mock-placeholder
      chat:
        completions-path: /v1/chat/completions
        options:
          model: deepseek-chat
          temperature: 0.2
          max-tokens: 1200
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/stable_angina?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: StableAngina@123
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      pool-name: StableAnginaHikari
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: StableAngina@123
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.stable_angina.**.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.stable_angina

sa:
  jwt:
    secret: stable-angina-dev-only-secret-key-please-change-in-prod
    access-token-expire-minutes: 120
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: stable-angina

ai:
  mock: true

logging:
  level:
    com.stable_angina: debug
    org.springframework.security: info
    org.flywaydb: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
