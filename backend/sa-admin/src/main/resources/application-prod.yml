# =====================================================================
# 生产环境：容器内运行，全部走环境变量，禁止在配置文件中出现明文密码
# 容器内端口 8080（jar 内部），宿主机映射由 docker-compose 决定
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stable_angina}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      pool-name: StableAnginaHikari
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 20s

sa:
  jwt:
    secret: ${JWT_SECRET}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}

logging:
  level:
    com.stable.angina: info
    root: warn
  file:
    name: /app/logs/stable-angina.log
