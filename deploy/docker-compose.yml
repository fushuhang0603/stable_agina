# =====================================================================
# 稳定性心绞痛患者随访管理系统 —— 单机部署编排
# 用法：
#   只起中间件（日常开发）：  docker compose up -d mysql redis minio
#   连后端一起起：            docker compose --profile app up -d --build
# 前置：deploy/.env 由 .env.example 复制并改密码；后端 jar 已构建
#       mvn -f backend/pom.xml clean package -DskipTests
# =====================================================================
name: stable-angina-dev

services:
  # -------------------------------------------------------------------
  # MySQL 8：数据库 stable_angina，首次启动由 Flyway 自动建表
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: stable-angina-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stable_angina}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=300
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - stable_angina_mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stable-angina-net

  # -------------------------------------------------------------------
  # Redis 7：登录白名单 auth:token:{userId}:{jti} + 业务缓存
  # -------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: stable-angina-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - stable_angina_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stable-angina-net

  # -------------------------------------------------------------------
  # MinIO：附件/报告对象存储（浏览器走预签名 URL 直连，不经 nginx）
  # -------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: stable-angina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - stable_angina_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - stable-angina-net

  # 初始化存储桶（幂等；桶名与 sa.minio.bucket 保持一致）
  minio-init:
    image: minio/mc:latest
    container_name: stable-angina-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-stable-angina};
      echo '[minio-init] bucket ready';
      "
    networks:
      - stable-angina-net

  # -------------------------------------------------------------------
  # 后端：聚合 jar（镜像需先执行 mvn package 生成 sa-admin.jar）
  # -------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sa-admin
      args:
        JAR_FILE: backend/sa-admin/target/sa-admin.jar
    image: stable-angina-api:1.0.0
    container_name: stable-angina-api
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stable_angina}
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stable-angina}
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-mock-placeholder}
      AI_MOCK: ${AI_MOCK:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - stable_angina_api_logs:/app/logs
    networks:
      - stable-angina-net

  # -------------------------------------------------------------------
  # Nginx：/stableanginaapi/ 反代后端；/admin/、/patient/ 托管前端静态
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: stable-angina-nginx
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - api
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/admin/dist:/usr/share/nginx/html/admin:ro
      - ../frontend/uniapp/dist:/usr/share/nginx/html/patient:ro
    networks:
      - stable-angina-net

networks:
  stable-angina-net:
    driver: bridge

volumes:
  stable_angina_mysql_data:
    name: stable_angina_mysql_data
  stable_angina_redis_data:
    name: stable_angina_redis_data
  stable_angina_minio_data:
    name: stable_angina_minio_data
  stable_angina_api_logs:
    name: stable_angina_api_logs
