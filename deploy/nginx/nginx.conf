# =====================================================================
# Nginx：静态资源 + 后端反向代理
#  - /stableanginaapi/ → api:8080（后端 context-path 保持 /stableanginaapi）
#  - /admin/           → 医生端 + 管理员端（frontend/admin/dist）
#  - /patient/         → 患者端 H5（frontend/uniapp/dist，uni-app 编译产物）
#  - 文件内容由浏览器直连 MinIO 预签名 URL，不经本机 nginx
# =====================================================================
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    upstream stable_angina_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # ---------- 后端接口 ----------
        location /stableanginaapi/ {
            proxy_pass http://stable_angina_api/stableanginaapi/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ---------- 医生端 / 管理员端 ----------
        location /admin/ {
            try_files $uri $uri/ /admin/index.html;
        }

        # ---------- 患者端 H5 ----------
        location /patient/ {
            try_files $uri $uri/ /patient/index.html;
        }

        # ---------- 入口 ----------
        location = / {
            return 302 /admin/;
        }

        # ---------- 健康检查 ----------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    }
}
